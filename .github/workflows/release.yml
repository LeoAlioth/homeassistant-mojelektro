name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the manifest version
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/mojelektro/manifest.json'))['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi

      - name: Zip the integration
        run: cd custom_components/mojelektro && zip -r ../../mojelektro.zip . -x "__pycache__/*"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" mojelektro.zip --generate-notes --title "$GITHUB_REF_NAME"
